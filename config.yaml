# 쇼핑쇼츠 자동 제작 설정. 경로는 이 파일이 있는 폴더 기준.

paths:
  work: work            # 편별 폴더
  inbox: inbox          # AiPrice ZIP을 넣는 곳 (2단계에서 감시)
  assets: assets
  links: links.csv      # 상품명,URL (선택)
  ffmpeg: ffmpeg        # PATH에 없으면 전체 경로 (예: C:/ffmpeg/bin/ffmpeg.exe)
  ffprobe: ffprobe

voice:                  # 타입캐스트 API (키는 .env의 TYPECAST_API_KEY)
  voice_id: ""          # `python -m autoshorts voices` 로 목록을 보고 tc_... 값을 적는다
  model: ssfm-v30       # ssfm-v30 / ssfm-v21
  language: kor
  speed: 1.4            # 가이드 권장 1.3~1.5 (API 허용 0.5~2.0)
  emotion: normal       # normal / happy / sad / angry (v30: whisper, toneup, tonedown 추가)
  emotion_intensity: 1.0
  format: mp3
  timestamps: true      # with-timestamps 엔드포인트 사용. 안 되면 자동으로 일반 합성 + 글자 수 비례 타이밍

video:
  width: 1080
  height: 1920
  fps: 30
  tail_seconds: 1.0     # 나레이션 길이 + 여유
  narration_volume: 1.0
  bgm_volume: 0.12      # 배경음 음량 (0~1)
  bgm: ""               # 비우면 assets/bgm/ 의 첫 파일

title:                  # 시작 제목 2줄 (샘플 2 기준: 화면 가운데)
  font: assets/fonts/BlackHanSans-Regular.ttf
  size: 96
  line1_color: "#FFFFFF"
  line2_color: "#87CEEB"
  outline_color: "#000000"
  outline_width: 6
  position_y: 0.42      # 화면 위에서 비율. 자막 박스(0.56) 바로 위. 샘플 1처럼 상단이면 0.15
  duration: 1.0         # 초

captions:               # 자막 박스 (샘플 2 기준: 손글씨체, 위에서 56%)
  font: assets/fonts/NanumPenScript-Regular.ttf   # 고딕이면 NotoSansKR-Bold.ttf
  size: 72
  color: "#000000"
  box_color: "#FFFFFF"
  box_alpha: 0.75
  box_padding: 16
  position_y: 0.56
  chars_per_chunk: 15   # 조각당 글자 수 목표
  max_chunk_chars: 19
  min_chunk_seconds: 0.6
  native_numbers: true  # '세 칸' -> '3칸' 도 바꿀지
  replacements:         # 자막용 치환표 (한글 발음 -> 표기)
    퍼센트: "%"
    센티: cm
    밀리: mm
    엘이디: LED
    유에스비: USB

output:
  mp4: true             # FFmpeg final.mp4
  capcut: true          # 캡컷 프로젝트 (0단계 시험에서 안 열리면 false)
  preview_frames: true  # preview/ 에 1초 간격 화면

capcut:
  # 캡컷 설정 > 초안 위치. 보통 C:/Users/<이름>/AppData/Local/CapCut/User Data/Projects/com.lveditor.draft
  draft_folder: ""
  version_note: ""      # 시험에 성공한 캡컷 버전을 적어 둔다
  font: ""              # pycapcut FontType 이름. 비우면 캡컷 기본 글꼴 (한글 내장 글꼴 지정은 1단계 확인 사항)
  title_size: 15.0      # 캡컷 글자 크기 단위
  title_outline: 40.0
  title_line_gap: 0.07
  caption_size: 8.0
  caption_box_height: 0.14
  caption_box_width: 0.14
